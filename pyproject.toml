[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "uzima"
version = "0.1.0"
description = "Uzima: an agentic triage-desk assistant for public hospital OPDs. Scores and sequences on the South African Triage Scale; a named clinician confirms every change. Never diagnoses."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
  "mcp-server-time>=0.6",
  "langgraph>=0.4",
  "langchain-core>=0.3",
  "langchain-ollama>=0.3",
  "langchain-mcp-adapters>=0.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
uzima = "uzima.cli:main"
uzima-server = "uzima.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/uzima"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
